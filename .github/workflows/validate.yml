name: Validate SQL50 notebooks

on:
  push:
    branches:
      - main
      - build/finalize
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run pytest
        run: pytest -v

      - name: Validate all notebooks
        run: python tools/validate_notebooks.py .
